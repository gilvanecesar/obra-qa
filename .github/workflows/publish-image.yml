name: Publish preview image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm test
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: image
        with:
          context: .
          file: openclaw/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish digest and deployment caveat
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "Image: ghcr.io/${REPOSITORY}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview runtime only. Configure each installation's private executor before admission. No automatic promotion or one-click activation." >> "$GITHUB_STEP_SUMMARY"
